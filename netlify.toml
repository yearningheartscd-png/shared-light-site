[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Environment variables — set these in Netlify dashboard > Site settings > Environment variables:
# NEXT_PUBLIC_SUPABASE_URL
# NEXT_PUBLIC_SUPABASE_ANON_KEY
# SUPABASE_SERVICE_ROLE_KEY

# Redirect all requests to the Next.js handler (handled by the plugin)
# No manual redirects needed — the plugin manages SSR + static routing.
