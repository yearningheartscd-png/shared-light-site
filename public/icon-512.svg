<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="80" fill="#020617"/>
  <g transform="translate(256, 256)">
    <!-- Outer glow ring -->
    <circle r="170" fill="none" stroke="#22d3ee" stroke-width="3" opacity="0.2"/>
    <circle r="140" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.15"/>
    <!-- Main diamond layers icon -->
    <g transform="translate(-100, -75) scale(8.33)">
      <polygon points="12,2 2,7 12,12 22,7" fill="none" stroke="#22d3ee" stroke-width="1.2" stroke-linejoin="round"/>
      <polyline points="2,12 12,17 22,12" fill="none" stroke="#06b6d4" stroke-width="1.2" stroke-linejoin="round"/>
      <polyline points="2,17 12,22 22,17" fill="none" stroke="#0891b2" stroke-width="1.2" stroke-linejoin="round"/>
    </g>
    <!-- Center dot -->
    <circle r="8" fill="#22d3ee"/>
    <!-- Subtitle text -->
    <text y="120" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="28" font-weight="600" letter-spacing="8">ATLAS</text>
  </g>
</svg>
